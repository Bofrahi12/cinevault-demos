<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineVault — Product Demos</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a0f; color:#f5f5f5; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  header { text-align:center; padding:48px 20px 12px; }
  header h1 { font-size:2rem; letter-spacing:4px; color:#d4af37; }
  header p { color:#999; margin-top:8px; font-size:.95rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:24px; padding:32px 20px 60px; max-width:1400px; margin:0 auto; }
  .card { background:#14141c; border:1px solid #2a2a35; border-radius:14px; overflow:hidden; transition:transform .2s, border-color .2s; }
  .card:hover { transform:translateY(-4px); border-color:#d4af37; }
  .card video { width:100%; aspect-ratio:16/9; display:block; background:#000; }
  .info { padding:16px 18px 20px; display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .info h2 { font-size:1rem; font-weight:600; line-height:1.35; }
  .price { color:#d4af37; font-weight:700; font-size:1.05rem; white-space:nowrap; }
  footer { text-align:center; color:#666; padding:0 20px 40px; font-size:.85rem; }
</style>
</head>
<body>
<header>
  <h1>CINEVAULT</h1>
  <p>Full-quality demo reels — every product</p>
</header>
<div class="grid" id="grid"></div>
<footer>© 2026 CineVault · Demos shown at full 1080p quality</footer>
<script>
const products = [
  ["luts50","50 Cinematic LUTs","$15"],
  ["sonyslog3","Sony S-Log3 30 LUTs","$15"],
  ["wedding","25 Wedding & Romance LUTs","$15"],
  ["lightroom","20 Cinematic Lightroom Presets","$14.99"],
  ["transitions","50 Seamless Transitions","$27.99"],
  ["sfx","30 Cinematic SFX","$12"],
  ["whooshes","50 Whooshes & Impacts","$12.99"],
  ["filmgrain","Film Grain + Light Leaks","$7.99"],
  ["reelsprompts","150 AI Video Prompts for Viral Reels","$6.99"],
  ["creatorprompts","200 AI Prompts for Content Creators","$6.99"],
  ["ugcmachine","UGC AD MACHINE™","$29"],
  ["budget","Ultimate Monthly Budget Tracker","$10.99"],
  ["planner","Undated Digital Planner 2026","$9.99"],
  ["freeluts","3 Free Cinematic LUTs","Free"],
  ["bundle","Complete Bundle","$39"],
];
document.getElementById("grid").innerHTML = products.map(([slug,name,price]) => `
  <div class="card">
    <video controls preload="none" poster="posters/${slug}.jpg" playsinline>
      <source src="videos/${slug}.mp4" type="video/mp4">
    </video>
    <div class="info"><h2>${name}</h2><span class="price">${price}</span></div>
  </div>`).join("");
</script>
</body>
</html>
